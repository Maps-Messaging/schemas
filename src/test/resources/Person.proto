// [START declaration]
syntax = "proto2";
package io.mapsmessaging.schemas.formatters;
// [END declaration]

// [START java_declaration]
option java_multiple_files = false;
option java_package = "io.mapsmessaging.schemas.formatters";
option java_outer_classname = "PersonProto";
// [END java_declaration]

// [START messages]
message Person {
  required string stringId = 1;  // ASCII string identifier
  required int64  longId = 2;  // 64-bit integer value
  required int32  intId = 3;  // 32-bit integer value
  required float  floatId = 4;  // Float precision value
  required double doubleId = 5;  // Double precision value
  optional bool   booleanId = 6;  // Boolean true/false flag
  optional bytes  bytesId = 7;  // Binary data (Base64 when serialized to JSON)
  repeated int32  arrayId = 8;  // Array of integers
  optional Color  enumId = 9;  // Enumerated color value
  optional int64 timestampId = 10; // ISO 8601 timestamp string
}

// Enum for color choices
enum Color {
  RED = 0;
  GREEN = 1;
  BLUE = 2;
}
// [END messages]
